[package]
name = "zeryth-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native driver for the Zeryth engine: the same sweep the browser runs, over plain gRPC."

[[bin]]
name = "zeryth"
path = "src/main.rs"

[dependencies]
zeryth-engine = { path = "../engine" }
zcash_protocol = "0.11.0"
zcash_client_backend = { version = "0.25.0", default-features = false, features = [
    "orchard",
    "lightwalletd-tonic",
    "lightwalletd-tonic-transport",
    "lightwalletd-tonic-tls-webpki-roots",
] }
tonic = { version = "0.14", default-features = false, features = ["transport", "tls-webpki-roots", "tls-ring", "codegen"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
serde_json = "1"
hex = "0.4"
