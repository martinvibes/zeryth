# getrandom 0.3 will not compile for wasm32-unknown-unknown without being told which
# backend to use. The browser one is `wasm_js`, which calls `crypto.getRandomValues`.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']

# zcash_script (via zcash_transparent 0.11) compiles libsecp256k1 from C. Apple's clang
# has no wasm32 backend, so the wasm build uses Homebrew LLVM's.
[env]
CC_wasm32_unknown_unknown = "/opt/homebrew/opt/llvm/bin/clang"
AR_wasm32_unknown_unknown = "/opt/homebrew/opt/llvm/bin/llvm-ar"
